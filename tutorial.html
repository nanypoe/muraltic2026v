<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando... - Mural TIC 2026</title>
    <link rel="stylesheet" href="css/mural-style.css">
    <style>
        /* Estilos específicos para la visualización de tutoriales */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .guia-texto {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            margin-top: 1rem;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .btn-regresar {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--inatec-blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main class="container" style="margin-top: 1rem;">
        <a href="index.html" class="btn-regresar" id="link-volver">← Volver al inicio</a>

        <section id="contenido-dinamico">
            <h2 id="titulo-pagina" style="color: var(--inatec-blue); margin-bottom: 0.5rem;">Cargando...</h2>
            <p id="descripcion-pagina" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>

            <div id="area-video" class="video-container" style="display: none;">
                <iframe id="player-youtube" src="" allowfullscreen></iframe>
            </div>

            <div id="area-buscador" style="display: none;">
                </div>

            <div id="area-guia" class="guia-texto">
                <div id="cuerpo-guia">
                    </div>
            </div>
        </section>
    </main>

    <script src="js/core.js"></script>
    <script src="js/tutoriales.js"></script>
</body>
</html>
